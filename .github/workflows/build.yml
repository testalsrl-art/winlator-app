name: Build APK

on:
  push:
    branches: [gps-shortcut]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK / CMake / platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/winlator.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/winlator.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build x86_64 serial ioctl shim
        run: |
          gcc -shared -fPIC -O2 -Wall -o app/src/main/assets/libwinlator_serial.so tools/serialshim.c -ldl
          file app/src/main/assets/libwinlator_serial.so

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|\.java:[0-9]+:|What went wrong|FAILED" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: winlator-gps-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build serial test tool (Windows exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686
          i686-w64-mingw32-gcc -O2 -static -o serialtest.exe tools/serialtest.c

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" winlator-gps.apk
          gh release create "gps-build-${{ github.run_number }}" winlator-gps.apk serialtest.exe \
            --title "Winlator GPS+Shortcut build ${{ github.run_number }}" \
            --notes "Android GPS -> NMEA on virtual COM1-COM8, plus home-screen shortcut launcher."
